<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fountainhead CMS — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#0C1920;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box{background:white;border-radius:12px;padding:48px 40px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.fs-star{width:48px;height:48px;background:#F2C418;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);margin:0 auto 16px;}
h1{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:800;color:#0C1920;margin-bottom:6px;}
.subtitle{font-size:0.85rem;color:#5a6878;margin-bottom:32px;}
.google-btn{display:inline-flex;align-items:center;gap:12px;background:#fff;border:2px solid #dde2ea;border-radius:8px;padding:13px 24px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.88rem;color:#1a2530;text-decoration:none;transition:0.2s;width:100%;justify-content:center;cursor:pointer;}
.google-btn:hover{border-color:#005BAA;background:#f0f6ff;color:#005BAA;}
.google-icon{width:20px;height:20px;flex-shrink:0;}
.error{background:#fff0f0;border:1px solid #f5c6c6;border-radius:6px;padding:12px 16px;color:#B8292F;font-size:0.84rem;margin-bottom:20px;display:none;}
.error.show{display:block;}
.footer-note{font-size:0.72rem;color:#8a95a3;margin-top:24px;}
</style>
</head>
<body>
<div class="login-box">
  <div class="fs-star"></div>
  <h1>Fountainhead CMS</h1>
  <p class="subtitle">Sign in with your authorised Google account</p>

  <div class="error" id="err-msg"></div>

  <a href="/auth/google" class="google-btn">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Sign in with Google
  </a>

  <p class="footer-note">Only authorised accounts can access this system.<br>Contact your admin if you need access.</p>
</div>
<script>
const params = new URLSearchParams(location.search);
if (params.get('error')) {
  const el = document.getElementById('err-msg');
  el.textContent = params.get('error') === 'no_access'
    ? 'Your Google account is not authorised. Contact admin for access.'
    : 'Login failed. Please try again.';
  el.classList.add('show');
}
</script>
</body>
</html>
